name: Build Purple Haze staff APK

on:
  push:
    branches: [main]
    paths:
      - "restaurant-ops/**"
      - ".github/workflows/build-staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Install JavaScript dependencies
        working-directory: restaurant-ops
        run: npm ci

      - name: Generate Android project from Expo config
        working-directory: restaurant-ops
        run: npx expo prebuild --platform android --no-install

      - name: Build installable APK
        working-directory: restaurant-ops/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp restaurant-ops/android/app/build/outputs/apk/debug/app-debug.apk release/purple-haze-operations.apk
          tag="staff-${GITHUB_SHA:0:12}"
          gh release create "$tag" release/purple-haze-operations.apk \
            --title "Purple Haze Staff Operations $tag" \
            --notes "Internal Android APK for existing Purple Haze staff and administrator accounts. Access remains role restricted by the backend."
