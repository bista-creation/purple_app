name: Build Purple Haze staff APK

on:
  push:
    branches: [main]
    paths:
      - "restaurant-ops/**"
      - ".github/workflows/build-staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out app source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download verified Android command line tools
        run: |
          mkdir -p /tmp/android-cli
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o /tmp/android-cli-tools.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli-tools.zip" | sha256sum --check

      - name: Install Android command line tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          mkdir -p "$sdk_root/cmdline-tools" /tmp/android-cli
          unzip -q /tmp/android-cli-tools.zip -d /tmp/android-cli
          rm -rf "$sdk_root/cmdline-tools/latest"
          mv /tmp/android-cli/cmdline-tools "$sdk_root/cmdline-tools/latest"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then exit "$license_status"; fi
          "$sdkmanager_path" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install JavaScript dependencies
        working-directory: restaurant-ops
        run: npm ci

      - name: Generate Android project from Expo config
        working-directory: restaurant-ops
        run: npx expo prebuild --platform android --no-install

      - name: Build installable APK
        working-directory: restaurant-ops/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp restaurant-ops/android/app/build/outputs/apk/debug/app-debug.apk release/purple-haze-operations.apk
          tag="staff-${GITHUB_SHA:0:12}"
          gh release create "$tag" release/purple-haze-operations.apk \
            --title "Purple Haze Staff Operations $tag" \
            --notes "Internal Android APK for existing Purple Haze staff and administrator accounts. Access remains role restricted by the backend."
