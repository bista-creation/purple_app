name: Build Purple Haze staff APK

on:
  push:
    branches: [main]
    paths:
      - "restaurant-ops/**"
      - ".github/workflows/build-staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out app source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root" /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager_path" ]; then
            echo "Android SDK manager was not found. ANDROID_HOME=${ANDROID_HOME:-unset}; ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            find /usr/local/lib/android /opt /usr/lib/android-sdk -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          sdk_root="$(dirname "$(dirname "$(dirname "$(dirname "$sdkmanager_path")")")")"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" --install \
            "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Install JavaScript dependencies
        working-directory: restaurant-ops
        run: npm ci

      - name: Generate Android project from Expo config
        working-directory: restaurant-ops
        run: npx expo prebuild --platform android --no-install

      - name: Build installable APK
        working-directory: restaurant-ops/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp restaurant-ops/android/app/build/outputs/apk/debug/app-debug.apk release/purple-haze-operations.apk
          tag="staff-${GITHUB_SHA:0:12}"
          gh release create "$tag" release/purple-haze-operations.apk \
            --title "Purple Haze Staff Operations $tag" \
            --notes "Internal Android APK for existing Purple Haze staff and administrator accounts. Access remains role restricted by the backend."
